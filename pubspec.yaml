publish_to: "none"
version: 1.5.6+13

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  receive_sharing_intent: ^1.8.1
  pdfx: ^2.9.2
  image: ^4.5.4
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
