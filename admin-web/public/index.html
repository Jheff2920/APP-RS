<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RedPOS · generar código</title>
  <meta name="robots" content="noindex, nofollow"/>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
      background: #f4f4f5;
      color: #111;
    }
    h1 { color: #2b0a53; font-size: 1.4rem; }
    label { display: block; margin-top: .85rem; }
    input, button { font-size: 1rem; padding: .55rem .75rem; }
    input { width: 100%; box-sizing: border-box; margin-top: .35rem; }
    button {
      background: #2b0a53;
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .code {
      font-size: 1.5rem;
      letter-spacing: .08em;
      font-family: ui-monospace, monospace;
      margin: 1rem 0 .4rem;
      color: #2b0a53;
    }
    .hint { color: #555; line-height: 1.45; }
    .warn { color: #9a3412; }
    .copy {
      background: transparent;
      color: #2b0a53;
      border: 1px solid #2b0a53;
      margin-left: .35rem;
      margin-top: 0;
      font-size: .85rem;
      padding: .25rem .5rem;
    }
  </style>
</head>
<body>
  <h1>Generar código RedPOS</h1>
  <p class="hint">Crea un código para activar la app sin publicidad.</p>
  <label>Clave
    <input id="pw" type="password" autocomplete="current-password"/>
  </label>
  <p><button id="go" type="button">Generar código</button></p>
  <p id="out" class="code"></p>
  <p id="msg" class="hint"></p>
  <script>
    function setMsg(text, warn) {
      const el = document.getElementById('msg');
      el.textContent = text || '';
      el.className = warn ? 'hint warn' : 'hint';
    }

    document.getElementById('go').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = '…';
      setMsg('');
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      const data = await res.json();
      if (!data.code) {
        out.textContent = '';
        setMsg(data.error === 'clave' ? 'Clave incorrecta.' : (data.error || 'error'), true);
        return;
      }
      out.innerHTML = '';
      const code = document.createElement('span');
      code.textContent = data.code;
      const copy = document.createElement('button');
      copy.className = 'copy';
      copy.type = 'button';
      copy.textContent = 'Copiar';
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(data.code);
          copy.textContent = 'Copiado';
          setTimeout(() => { copy.textContent = 'Copiar'; }, 1200);
        } catch (_) {}
      };
      out.append(code, copy);
    };
  </script>
</body>
</html>
