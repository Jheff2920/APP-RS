<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RedPOS · códigos</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
      background: #f4f4f5;
      color: #111;
    }
    h1 { color: #2b0a53; font-size: 1.4rem; }
    input, button { font-size: 1rem; padding: .55rem .75rem; }
    input { width: 100%; box-sizing: border-box; margin-top: .35rem; }
    button {
      background: #2b0a53;
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .code {
      font-size: 1.5rem;
      letter-spacing: .08em;
      font-family: ui-monospace, monospace;
      margin: 1rem 0;
      color: #2b0a53;
    }
    .hint { color: #555; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Códigos RedPOS Service</h1>
  <p class="hint">Genera un código para activar la app sin publicidad.</p>
  <label>Clave
    <input id="pw" type="password" autocomplete="current-password"/>
  </label>
  <p><button id="go" type="button">Generar código</button></p>
  <p id="out" class="code"></p>
  <script>
    document.getElementById('go').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = '…';
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      const data = await res.json();
      out.textContent = data.code || data.error || 'error';
    };
  </script>
</body>
</html>
