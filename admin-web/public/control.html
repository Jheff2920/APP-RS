<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Control de keys RedPOS</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;700&display=swap"/>
  <style>
    /* Colores de la app RedPOS (lib/theme.dart). */
    :root {
      --morado: #2b0a53;
      --morado-hover: #3d1670;
      --morado-medio: #5b3a8e;
      --lila: #f5f3f9;
      --linea: #e6e0f0;
      --contorno: #c9bedb;
      --tinta: #1c1530;
      --tinta-suave: #5a5070;
      --papel: #fff;
      --termica: #2a2433;
      --termica-suave: #6b6577;
      --verde: #1b7f5a;
      --verde-suave: #e3f3ec;
      --ambar: #9a5b00;
      --ambar-suave: #fff1dc;
      --rojo: #b42318;
      --ui: 'Schibsted Grotesk', system-ui, sans-serif;
      --mono: 'Martian Mono', ui-monospace, monospace;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font: 400 1rem/1.5 var(--ui);
      color: var(--tinta);
      background: var(--lila);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: progress; opacity: .6; }
    :focus-visible { outline: 2px solid var(--morado-medio); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* Barra superior */
    .bar { background: var(--morado); color: #fff; }
    .bar-in {
      max-width: 80rem; margin: 0 auto; padding: .7rem 1.25rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .brand { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    .brand span { font-weight: 400; opacity: .75; margin-left: .35rem; }
    .bar nav { margin-left: auto; display: flex; gap: .5rem; flex-wrap: wrap; }
    .bar a, .bar button {
      color: #fff; background: transparent; text-decoration: none;
      border: 1px solid rgb(255 255 255 / 35%); border-radius: 8px;
      padding: .35rem .85rem; font-size: .9rem; line-height: 1.4;
    }
    .bar a:hover, .bar button:hover { background: rgb(255 255 255 / 12%); }
    .bar :focus-visible { outline-color: #fff; }

    /* Ticket térmico: sale de la ranura como en las impresoras de RedPOS */
    .printer { width: 100%; max-width: 21rem; }
    .slot {
      position: relative; z-index: 1; height: 14px; border-radius: 8px;
      background: var(--morado); box-shadow: inset 0 -5px 0 rgb(0 0 0 / 38%);
    }
    /* Recorta solo arriba (la ranura) para que la sombra respire a los lados y abajo. */
    .feed { clip-path: inset(0 -24px -48px -24px); margin: -7px 10px 0; padding-bottom: 8px; }
    .ticket {
      position: relative; background: var(--papel); color: var(--termica);
      font-family: var(--mono); font-size: .75rem; line-height: 1.8;
      padding: 1.5rem 1.25rem 1.1rem;
      filter: drop-shadow(0 6px 10px rgb(43 10 83 / 13%));
    }
    .ticket::after {
      content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 8px;
      background:
        linear-gradient(135deg, var(--papel) 50%, transparent 50%) 0 0 / 12px 8px repeat-x,
        linear-gradient(-135deg, var(--papel) 50%, transparent 50%) 0 0 / 12px 8px repeat-x;
    }
    .ticket p { margin: 0; }
    .ticket hr { border: 0; border-top: 1px dashed #b9b3c4; margin: .8rem 0; }
    .t-head { font-weight: 600; font-size: .8rem; text-align: center; line-height: 1.6; }
    .t-meta { text-align: center; color: var(--termica-suave); }
    .t-row { display: flex; justify-content: space-between; gap: 1rem; }
    .t-sub { color: var(--termica-suave); padding-left: .9rem; }
    .t-total { font-size: 1.3rem; font-weight: 600; line-height: 1.4; align-items: baseline; }
    .t-total span:first-child { font-size: .8rem; }
    .ticket.printing { animation: feed 1.1s steps(16, end) both; }
    @keyframes feed { from { transform: translateY(-100%); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ticket.printing { animation: none; } }

    /* Entrada con clave */
    .lock { display: flex; justify-content: center; padding: 12vh 1.25rem 4rem; }
    .lock label {
      display: block; font-family: var(--ui); font-size: .9rem; font-weight: 500;
      margin: .25rem 0 .35rem;
    }
    .lock input {
      width: 100%; font-family: var(--ui); font-size: 1rem; background: #fff;
      border: 1px solid var(--contorno); border-radius: 8px; padding: .6rem .75rem;
    }
    .lock .btn { width: 100%; margin-top: .75rem; font-family: var(--ui); font-size: 1rem; }
    .ticket .lock-msg {
      font-family: var(--ui); font-size: .85rem; line-height: 1.4;
      color: var(--rojo); min-height: 1.2rem; margin-top: .6rem;
    }

    .btn {
      background: var(--morado); color: #fff; border: 0; border-radius: 8px;
      padding: .6rem 1rem; font-weight: 500;
    }
    .btn:hover { background: var(--morado-hover); }
    .hint { color: var(--tinta-suave); font-size: .875rem; margin: .45rem 0 0; }

    /* Panel */
    .app {
      max-width: 80rem; margin: 0 auto; padding: 1.75rem 1.25rem 4rem;
      display: grid; grid-template-columns: 20rem minmax(0, 1fr);
      gap: 2.25rem; align-items: start;
    }
    .side { position: sticky; top: 1.25rem; }
    .global { margin-top: 1rem; max-width: 21rem; }
    .global label { display: block; font-weight: 500; margin-bottom: .35rem; }
    .field { display: flex; gap: .5rem; }
    .money-in {
      flex: 1; display: flex; align-items: center; background: #fff;
      border: 1px solid var(--contorno); border-radius: 8px; padding-left: .7rem;
    }
    .money-in:focus-within { outline: 2px solid var(--morado-medio); outline-offset: 1px; }
    .money-in span { color: var(--tinta-suave); }
    .money-in input {
      border: 0; background: transparent; width: 100%; min-width: 0;
      padding: .55rem .5rem;
    }
    .money-in input:focus-visible { outline: none; }

    .list-head {
      display: flex; align-items: end; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    h1 {
      margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 700;
      letter-spacing: -.02em; color: var(--morado);
    }
    .search { flex: 0 1 17rem; }
    .search input {
      width: 100%; background: #fff; border: 1px solid var(--contorno);
      border-radius: 8px; padding: .5rem .75rem;
    }
    .tabs {
      display: flex; flex-wrap: wrap; gap: .25rem;
      margin: 1rem 0 .5rem; border-bottom: 1px solid var(--linea);
    }
    .tabs button {
      background: none; border: 0; border-bottom: 2px solid transparent;
      margin-bottom: -1px; padding: .55rem .7rem; color: var(--tinta-suave); font-weight: 500;
    }
    .tabs button:hover { color: var(--tinta); }
    .tabs button[aria-pressed="true"] { color: var(--morado); border-bottom-color: var(--morado); }
    .tabs .n {
      margin-left: .3rem; padding: 0 .45rem; border-radius: 999px; font-size: .8rem;
      background: var(--linea); color: var(--tinta-suave);
    }
    .tabs .n.alert { background: var(--ambar-suave); color: var(--ambar); }
    .msg { min-height: 1.6rem; margin: 0 0 .4rem; font-size: .9rem; color: var(--verde); }
    .msg.error { color: var(--rojo); }

    .table-wrap { background: #fff; border: 1px solid var(--linea); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: .8rem; font-weight: 500; color: var(--tinta-suave);
      padding: .6rem .85rem; background: #faf9fc; border-bottom: 1px solid var(--linea);
    }
    td { padding: .7rem .85rem; border-bottom: 1px solid var(--linea); font-size: .92rem; vertical-align: middle; }
    .c-code { white-space: nowrap; min-width: 15rem; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fcfbfe; }
    /* Entregada = vendida sin activar todavía: la franja pide seguimiento. */
    tr.is-pending td:first-child { box-shadow: inset 3px 0 0 var(--ambar); }
    .code { font-family: var(--mono); font-size: .78rem; font-weight: 600; white-space: nowrap; }
    .ghost {
      background: none; border: 1px solid var(--linea); border-radius: 6px;
      padding: .15rem .5rem; font-size: .78rem; color: var(--tinta-suave);
    }
    .ghost:hover { border-color: var(--contorno); color: var(--tinta); }
    .copy { margin-left: .5rem; }
    .pill {
      display: inline-block; border-radius: 999px; padding: .1rem .6rem;
      font-size: .8rem; font-weight: 500; white-space: nowrap;
    }
    .pill.used { background: var(--verde-suave); color: var(--verde); }
    .pill.pending { background: var(--ambar-suave); color: var(--ambar); }
    .pill.free { box-shadow: inset 0 0 0 1px var(--contorno); color: var(--tinta-suave); }
    .pill.released { background: var(--lila); color: var(--morado-medio); box-shadow: inset 0 0 0 1px var(--contorno); }
    .client {
      display: block; max-width: 17rem; margin-top: .4rem; padding: 0;
      background: none; border: 0; text-align: left; white-space: normal;
    }
    .client b { display: block; font-size: .85rem; font-weight: 600; }
    .client:hover b { text-decoration: underline; text-underline-offset: 2px; }
    .contact { display: flex; flex-wrap: wrap; gap: 0 .75rem; font-size: .75rem; color: var(--tinta-suave); }
    .kind {
      display: inline-block; margin-left: .4rem; padding: 0 .45rem; border-radius: 999px;
      font-size: .7rem; font-weight: 500; vertical-align: 1px;
    }
    .kind.lifetime { background: var(--morado); color: #fff; }
    .kind.trial { box-shadow: inset 0 0 0 1px var(--contorno); color: var(--tinta-suave); }
    .c-code .link { margin-top: .35rem; }
    .tools { display: flex; gap: .5rem; flex: 0 1 28rem; }
    .tools .search { flex: 1; }
    .tools select {
      background: #fff; border: 1px solid var(--contorno); border-radius: 8px; padding: .5rem .6rem;
    }

    /* Ficha del cliente */
    dialog {
      width: min(30rem, calc(100vw - 2rem)); padding: 0; border: 0; border-radius: 14px;
      color: var(--tinta); box-shadow: 0 24px 60px rgb(43 10 83 / 28%);
    }
    dialog::backdrop { background: rgb(28 21 48 / 45%); }
    .dlg { display: grid; gap: .8rem; padding: 1.25rem 1.25rem 1rem; }
    .dlg h2 { margin: 0; font-size: 1.15rem; color: var(--morado); }
    .dlg h2 .code { display: block; margin-top: .2rem; color: var(--tinta-suave); }
    .dlg label { display: grid; gap: .3rem; font-size: .9rem; font-weight: 500; }
    .dlg input, .dlg select, .dlg textarea {
      width: 100%; font-weight: 400; background: #fff;
      border: 1px solid var(--contorno); border-radius: 8px; padding: .5rem .65rem;
    }
    .dlg textarea { min-height: 4.5rem; resize: vertical; }
    .dlg .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .dlg .err { margin: 0; min-height: 1.2rem; font-size: .85rem; color: var(--rojo); }
    .dlg-actions { display: flex; justify-content: flex-end; gap: .5rem; }
    .btn.plain { background: #fff; color: var(--morado); box-shadow: inset 0 0 0 1px var(--contorno); }
    .btn.plain:hover { background: var(--lila); }
    @media (max-width: 480px) { .dlg .pair { grid-template-columns: 1fr; } .tools { flex-wrap: wrap; } }
    .link {
      display: block; background: none; border: 0; padding: .15rem 0 0;
      color: var(--morado-medio); font-size: .8rem; white-space: nowrap;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .link:hover { color: var(--morado); }
    .price { display: flex; align-items: center; gap: .35rem; }
    .price span { color: var(--tinta-suave); font-size: .85rem; }
    .price input {
      width: 5.5rem; background: #fff; border: 1px solid var(--contorno);
      border-radius: 6px; padding: .25rem .45rem;
    }
    .note { display: block; font-size: .75rem; color: var(--tinta-suave); margin-top: .15rem; }
    .none { color: var(--contorno); }
    .c-date { color: var(--tinta-suave); font-size: .85rem; white-space: nowrap; }
    tr.empty td { text-align: center; color: var(--tinta-suave); padding: 2.5rem 1rem; }

    @media (max-width: 880px) {
      .app { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
      .side { position: static; }
    }
    @media (max-width: 640px) {
      thead { display: none; }
      tbody tr {
        display: grid; grid-template-columns: 1fr auto; gap: .45rem .75rem;
        padding: .85rem 1rem; border-bottom: 1px solid var(--linea);
      }
      tbody tr:last-child { border-bottom: 0; }
      td { padding: 0; border: 0; }
      tbody tr:hover td { background: none; }
      .c-state { text-align: right; }
      .c-price { grid-column: 1 / -1; }
      .c-price.is-empty { display: none; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .tabs button { white-space: nowrap; }
      .c-date::before { content: attr(data-label) ' '; }
      tr.is-pending { box-shadow: inset 3px 0 0 var(--ambar); }
      tr.is-pending td:first-child { box-shadow: none; }
      tr.empty { display: block; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <p class="brand">RedPOS <span>Control de keys</span></p>
      <nav>
        <a href="/">Generar keys</a>
        <button type="button" id="refresh" hidden>Actualizar</button>
        <button type="button" id="logout" hidden>Salir</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="lock" id="lock">
      <div class="printer">
        <div class="slot" aria-hidden="true"></div>
        <div class="feed">
          <form class="ticket printing" id="lock-form">
            <p class="t-head">Red Soluciones<br/>Keys de RedPOS</p>
            <hr/>
            <label for="pw">Clave de control</label>
            <input id="pw" type="password" autocomplete="current-password" required/>
            <button class="btn" type="submit" id="unlock">Ver keys</button>
            <p class="lock-msg" id="lock-msg" role="alert"></p>
          </form>
        </div>
      </div>
    </section>

    <div class="app" id="app" hidden>
      <aside class="side">
        <div class="printer">
          <div class="slot" aria-hidden="true"></div>
          <div class="feed">
            <div class="ticket" id="ticket">
              <p class="t-head">Red Soluciones<br/>Keys de RedPOS</p>
              <p class="t-meta" id="t-date"></p>
              <hr/>
              <p class="t-row"><span>Usadas</span><span id="t-used"></span></p>
              <p class="t-row t-sub"><span id="t-g-label"></span><span id="t-g"></span></p>
              <p class="t-row t-sub"><span id="t-o-label"></span><span id="t-o"></span></p>
              <p class="t-row t-sub" id="t-gift-row" hidden><span id="t-gift-label"></span><span>S/ 0.00</span></p>
              <hr/>
              <p class="t-row t-total"><span>Total</span><span id="t-total"></span></p>
              <hr/>
              <p class="t-row"><span>Entregadas</span><span id="t-pending"></span></p>
              <p class="t-row"><span>Disponibles</span><span id="t-free"></span></p>
              <p class="t-row"><span>Generadas</span><span id="t-gen"></span></p>
              <p class="t-row"><span>Vendidas de por vida</span><span id="t-life"></span></p>
            </div>
          </div>
        </div>
        <form class="global" id="global-form">
          <label for="global-price">Precio por defecto</label>
          <div class="field">
            <div class="money-in">
              <span aria-hidden="true">S/</span>
              <input id="global-price" type="text" inputmode="decimal" placeholder="19.99" autocomplete="off"/>
            </div>
            <button class="btn" type="submit">Guardar</button>
          </div>
          <p class="hint">Se cobra en cada key usada que no tiene precio propio.</p>
        </form>
      </aside>

      <section aria-labelledby="list-title">
        <div class="list-head">
          <h1 id="list-title">Keys</h1>
          <div class="tools">
            <label class="search">
              <span class="sr">Buscar key o cliente</span>
              <input id="q" type="search" placeholder="Buscar key o cliente" autocomplete="off"/>
            </label>
            <label>
              <span class="sr">Tipo de key</span>
              <select id="kf">
                <option value="">Todos los tipos</option>
                <option value="lifetime">De por vida</option>
                <option value="trial">Regalo</option>
              </select>
            </label>
          </div>
        </div>
        <div class="tabs" id="tabs">
          <button type="button" data-filter="all" aria-pressed="true">Todas<span class="n" id="c-all">0</span></button>
          <button type="button" data-filter="pending" aria-pressed="false">Entregadas<span class="n" id="c-pending">0</span></button>
          <button type="button" data-filter="unused" aria-pressed="false">Disponibles<span class="n" id="c-free">0</span></button>
          <button type="button" data-filter="used" aria-pressed="false">Usadas<span class="n" id="c-used">0</span></button>
        </div>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Key</th><th>Estado</th><th>Precio</th><th>Creada</th><th>Usada</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <dialog id="client-dialog" aria-labelledby="d-title">
    <form class="dlg" id="client-form">
      <h2 id="d-title">Cliente<span class="code" id="d-code"></span></h2>
      <label>Nombre o negocio
        <input id="d-name" maxlength="80" autocomplete="off"/>
      </label>
      <div class="pair">
        <label>Teléfono o WhatsApp
          <input id="d-phone" type="tel" maxlength="40" autocomplete="off"/>
        </label>
        <label>Correo
          <input id="d-email" type="email" maxlength="120" autocomplete="off"/>
        </label>
      </div>
      <label>Tipo
        <select id="d-kind">
          <option value="lifetime">De por vida (vendida)</option>
          <option value="trial">Regalo o prueba (no suma al total)</option>
          <option value="">Sin definir</option>
        </select>
      </label>
      <label>Notas
        <textarea id="d-note" maxlength="200"></textarea>
      </label>
      <p class="err" id="d-err" role="alert"></p>
      <div class="dlg-actions">
        <button class="btn plain" type="button" id="d-cancel">Cancelar</button>
        <button class="btn" type="submit" id="d-save">Guardar cliente</button>
      </div>
    </form>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    let pw = '';
    let filter = 'all';
    let kindFilter = '';
    let editing = '';
    const KIND = { lifetime: 'De por vida', trial: 'Regalo' };
    let query = '';
    let rows = [];
    let globalPrice = null;
    let msgTimer = 0;

    const ERRORS = {
      clave: 'La clave de control no es correcta.',
      used: 'Esa key ya está usada.',
      missing: 'Esa key no está en el listado.',
      not_used: 'Eso solo se puede hacer con una key usada.',
      correo: 'Revisa el correo: debe ser como nombre@dominio.com.',
      precio: 'Escribe un precio válido, por ejemplo 19.99.',
      no_kv: 'El servidor no tiene la base de datos conectada en Vercel.',
    };

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function fmt(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString('es-PE', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).replace(',', '');
    }

    function money(n) {
      if (n == null || n === '' || Number.isNaN(Number(n))) return '—';
      return 'S/ ' + Number(n).toLocaleString('es-PE', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }

    function norm(s) {
      return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function errText(e) {
      if (e instanceof TypeError) return 'Sin conexión con el servidor. Revisa tu internet y vuelve a intentar.';
      return ERRORS[e.code] || `El servidor respondió «${e.message}». Vuelve a intentar.`;
    }

    function setMsg(text, isError) {
      const el = $('msg');
      el.textContent = text || '';
      el.className = isError ? 'msg error' : 'msg';
      clearTimeout(msgTimer);
      if (text && !isError) msgTimer = setTimeout(() => { el.textContent = ''; }, 4000);
    }

    async function api(path, body = {}) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, ...body }),
      });
      let data = {};
      try { data = await res.json(); } catch (_) { data = {}; }
      if (!res.ok || !data.ok) {
        const err = new Error(data.error || `HTTP ${res.status}`);
        err.code = data.error || '';
        throw err;
      }
      return data;
    }

    function print(el) {
      el.classList.remove('printing');
      void el.offsetWidth;
      el.classList.add('printing');
    }

    const isPending = (r) => !r.used && r.pending;
    const isFree = (r) => !r.used && !r.pending;

    async function loadList() {
      const data = await api('/api/codes');
      rows = data.codes || [];
      globalPrice = data.globalPrice ?? null;
      $('global-price').value = globalPrice ?? '';
      renderSummary(data);
      render();
      if (data.kv === false) setMsg('El listado necesita la base de datos (KV) conectada en Vercel.', true);
    }

    function renderSummary(data) {
      const used = rows.filter((r) => r.used);
      const gifts = used.filter((r) => r.kind === 'trial');
      const paid = used.filter((r) => r.kind !== 'trial');
      const own = paid.filter((r) => r.price != null);
      const withGlobal = paid.length - own.length;
      const counts = {
        all: rows.length,
        pending: rows.filter(isPending).length,
        free: rows.filter(isFree).length,
        used: used.length,
      };
      $('t-date').textContent = 'Corte ' + fmt(new Date().toISOString());
      $('t-used').textContent = counts.used;
      $('t-g-label').textContent = `${withGlobal} × ${globalPrice == null ? 'sin precio' : money(globalPrice)}`;
      $('t-g').textContent = globalPrice == null ? '—' : money(withGlobal * globalPrice);
      $('t-o-label').textContent = `${own.length} con precio propio`;
      $('t-o').textContent = money(own.reduce((sum, r) => sum + Number(r.price), 0));
      $('t-gift-row').hidden = gifts.length === 0;
      $('t-gift-label').textContent = `${gifts.length} de regalo`;
      $('t-total').textContent = money(data.money ? data.money.used : 0);
      $('t-life').textContent = rows.filter((r) => r.kind === 'lifetime').length;
      $('t-pending').textContent = counts.pending;
      $('t-free').textContent = counts.free;
      $('t-gen').textContent = counts.all;
      $('c-all').textContent = counts.all;
      $('c-pending').textContent = counts.pending;
      $('c-pending').classList.toggle('alert', counts.pending > 0);
      $('c-free').textContent = counts.free;
      $('c-used').textContent = counts.used;
    }

    function emptyText() {
      if (query) return `Ninguna key coincide con «${query}».`;
      if (kindFilter) return `No hay keys de tipo «${KIND[kindFilter]}» en este filtro.`;
      return {
        all: 'Todavía no hay keys. Genéralas en «Generar keys».',
        pending: 'No hay keys entregadas sin activar.',
        unused: 'No quedan keys disponibles. Genera nuevas en «Generar keys».',
        used: 'Todavía no hay keys usadas.',
      }[filter];
    }

    function rowHtml(r) {
      const code = esc(r.code || r.nonce);
      const nonce = esc(r.nonce);
      let state;
      if (r.used && r.released) {
        state = `<span class="pill released">Liberada</span>
          <span class="note">Vale una vez en otro teléfono</span>
          <button class="link" type="button" data-release="0" data-nonce="${nonce}">Cancelar</button>`;
      } else if (r.used) {
        state = `<span class="pill used">Usada</span>
          <span class="note">${r.bound ? 'Ligada a un teléfono' : 'Sin teléfono registrado'}</span>
          <button class="link" type="button" data-release="1" data-nonce="${nonce}">Liberar</button>`;
      } else if (r.pending) {
        state = `<span class="pill pending">Entregada</span>
          <button class="link" type="button" data-pending="0" data-nonce="${nonce}">Quitar entregada</button>`;
      } else {
        state = `<span class="pill free">Disponible</span>
          <button class="link" type="button" data-pending="1" data-nonce="${nonce}">Marcar entregada</button>`;
      }
      const own = r.price != null;
      const price = r.used && r.kind === 'trial'
        ? '<span class="note">Regalo: no suma al total</span>'
        : r.used
        ? `<div class="price">
            <span aria-hidden="true">S/</span>
            <input type="text" inputmode="decimal" aria-label="Precio de ${code}"
              data-nonce="${nonce}" placeholder="${esc(globalPrice ?? '')}"
              value="${own ? esc(r.price) : ''}"/>
            <button class="ghost" type="button" data-save="${nonce}">Guardar</button>
          </div>
          <span class="note">${own ? 'Precio propio' : 'Usa el precio por defecto'}</span>`
        : '<span class="none" aria-label="Sin precio">—</span>';
      return `<tr class="${isPending(r) ? 'is-pending' : ''}">
        <td class="c-code"><span class="code">${code}</span><button class="ghost copy" type="button" data-copy="${code}" aria-label="Copiar ${code}">Copiar</button>
          ${clientHtml(r, nonce, code)}</td>
        <td class="c-state">${state}</td>
        <td class="c-price${r.used ? '' : ' is-empty'}">${price}</td>
        <td class="c-date" data-label="Creada">${fmt(r.createdAt)}</td>
        <td class="c-date" data-label="Usada">${fmt(r.usedAt)}${r.reactivatedAt ? `<span class="note">Reactivada ${fmt(r.reactivatedAt)}</span>` : ''}</td>
      </tr>`;
    }

    function clientHtml(r, nonce, code) {
      const title = r.name || r.email || r.phone;
      if (!title && !r.kind && !r.note) {
        return `<button class="link" type="button" data-client="${nonce}">Agregar cliente</button>`;
      }
      const kind = r.kind ? `<span class="kind ${r.kind}">${KIND[r.kind]}</span>` : '';
      const extra = [r.phone, r.email].filter((v) => v && v !== title);
      return `<button class="client" type="button" data-client="${nonce}" aria-label="Editar cliente de ${code}">
          <b>${esc(title || 'Sin nombre')}${kind}</b>
          ${extra.length ? `<span class="contact">${extra.map((v) => `<span>${esc(v)}</span>`).join('')}</span>` : ''}
        </button>`;
    }

    function matches(r) {
      if (!query) return true;
      let q = norm(query);
      if (q.length > 2 && q.startsWith('RP')) q = q.slice(2);
      if (q && norm(r.code || r.nonce).includes(q)) return true;
      const text = query.toLowerCase();
      if ([r.name, r.email, r.note].some((v) => (v || '').toLowerCase().includes(text))) return true;
      const digits = query.replace(/\D/g, '');
      return digits.length >= 3 && (r.phone || '').replace(/\D/g, '').includes(digits);
    }

    function render() {
      const visible = rows.filter((r) => {
        if (filter === 'used' && !r.used) return false;
        if (filter === 'pending' && !isPending(r)) return false;
        if (filter === 'unused' && !isFree(r)) return false;
        if (kindFilter && r.kind !== kindFilter) return false;
        return matches(r);
      });
      $('rows').innerHTML = visible.length
        ? visible.map(rowHtml).join('')
        : `<tr class="empty"><td colspan="5">${esc(emptyText())}</td></tr>`;
    }

    function codeOf(nonce) {
      const r = rows.find((x) => x.nonce === nonce);
      return r ? (r.code || r.nonce) : nonce;
    }

    function lock() {
      pw = '';
      rows = [];
      $('rows').innerHTML = '';
      $('pw').value = '';
      $('app').hidden = true;
      $('refresh').hidden = true;
      $('logout').hidden = true;
      $('lock').hidden = false;
      print($('lock-form'));
      $('pw').focus();
    }

    $('lock-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = $('unlock');
      pw = $('pw').value;
      $('lock-msg').textContent = '';
      btn.disabled = true;
      btn.textContent = 'Abriendo…';
      try {
        await loadList();
        $('lock').hidden = true;
        $('app').hidden = false;
        $('refresh').hidden = false;
        $('logout').hidden = false;
        print($('ticket'));
      } catch (e) {
        pw = '';
        $('lock-msg').textContent = errText(e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ver keys';
      }
    });

    $('refresh').addEventListener('click', async () => {
      try {
        await loadList();
        setMsg('Listado actualizado.');
      } catch (e) {
        if (e.code === 'clave') return lock();
        setMsg(errText(e), true);
      }
    });

    $('logout').addEventListener('click', lock);

    $('global-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        await api('/api/settings', { price: $('global-price').value.trim() });
        await loadList();
        setMsg(globalPrice == null ? 'Precio por defecto quitado.' : `Precio por defecto guardado: ${money(globalPrice)}.`);
      } catch (e) {
        setMsg(errText(e), true);
      }
    });

    $('tabs').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-filter]');
      if (!btn) return;
      filter = btn.dataset.filter;
      document.querySelectorAll('#tabs [data-filter]').forEach((el) => {
        el.setAttribute('aria-pressed', el === btn ? 'true' : 'false');
      });
      render();
    });

    $('q').addEventListener('input', (ev) => {
      query = ev.target.value.trim();
      render();
    });

    $('kf').addEventListener('change', (ev) => {
      kindFilter = ev.target.value;
      render();
    });

    function openClient(nonce) {
      const r = rows.find((x) => x.nonce === nonce);
      if (!r) return;
      editing = nonce;
      $('d-code').textContent = r.code || r.nonce;
      $('d-name').value = r.name || '';
      $('d-phone').value = r.phone || '';
      $('d-email').value = r.email || '';
      // Una key nueva casi siempre es una venta de por vida.
      $('d-kind').value = r.kind || (r.name || r.email || r.phone ? '' : 'lifetime');
      $('d-note').value = r.note || '';
      $('d-err').textContent = '';
      $('client-dialog').showModal();
      $('d-name').focus();
    }

    $('d-cancel').addEventListener('click', () => $('client-dialog').close());

    $('client-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const nonce = editing;
      const client = {
        name: $('d-name').value,
        phone: $('d-phone').value,
        email: $('d-email').value,
        kind: $('d-kind').value,
        note: $('d-note').value,
      };
      $('d-save').disabled = true;
      $('d-err').textContent = '';
      try {
        await api('/api/key', { nonce, client });
        $('client-dialog').close();
        await loadList();
        setMsg(`Cliente guardado en ${codeOf(nonce)}.`);
      } catch (e) {
        $('d-err').textContent = errText(e);
      } finally {
        $('d-save').disabled = false;
      }
    });

    $('rows').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' || !ev.target.matches('.price input')) return;
      ev.preventDefault();
      ev.target.closest('.price').querySelector('[data-save]').click();
    });

    $('rows').addEventListener('click', async (ev) => {
      const clientBtn = ev.target.closest('[data-client]');
      if (clientBtn) {
        openClient(clientBtn.dataset.client);
        return;
      }

      const copyBtn = ev.target.closest('[data-copy]');
      if (copyBtn) {
        try {
          await navigator.clipboard.writeText(copyBtn.dataset.copy);
          copyBtn.textContent = 'Copiada';
          setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 1200);
        } catch (_) {
          setMsg('El navegador no dejó copiar. Selecciona la key y cópiala a mano.', true);
        }
        return;
      }

      const markBtn = ev.target.closest('[data-pending]');
      if (markBtn) {
        const nonce = markBtn.dataset.nonce;
        const pending = markBtn.dataset.pending === '1';
        markBtn.disabled = true;
        try {
          await api('/api/key', { nonce, pending });
          await loadList();
          setMsg(pending
            ? `${codeOf(nonce)} quedó como entregada.`
            : `${codeOf(nonce)} volvió a disponible.`);
        } catch (e) {
          markBtn.disabled = false;
          setMsg(errText(e), true);
        }
        return;
      }

      const releaseBtn = ev.target.closest('[data-release]');
      if (releaseBtn) {
        const nonce = releaseBtn.dataset.nonce;
        const release = releaseBtn.dataset.release === '1';
        if (release && !confirm(`¿Liberar ${codeOf(nonce)}?\n\nLa próxima activación desde cualquier teléfono valdrá una vez. Hazlo solo si confirmaste que es el mismo cliente.`)) return;
        releaseBtn.disabled = true;
        try {
          await api('/api/key', { nonce, release });
          await loadList();
          setMsg(release
            ? `${codeOf(nonce)} liberada: el cliente ya puede activarla en su teléfono nuevo.`
            : `${codeOf(nonce)} ya no está liberada.`);
        } catch (e) {
          releaseBtn.disabled = false;
          setMsg(errText(e), true);
        }
        return;
      }

      const saveBtn = ev.target.closest('[data-save]');
      if (saveBtn) {
        const nonce = saveBtn.dataset.save;
        const input = saveBtn.closest('.price').querySelector('input');
        saveBtn.disabled = true;
        try {
          const data = await api('/api/price', { nonce, price: input.value.trim() });
          await loadList();
          setMsg(data.price == null
            ? `${codeOf(nonce)} usa el precio por defecto.`
            : `Precio de ${codeOf(nonce)} guardado: ${money(data.price)}.`);
        } catch (e) {
          saveBtn.disabled = false;
          setMsg(errText(e), true);
        }
      }
    });
  </script>
</body>
</html>
